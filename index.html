function sheetsGet(sheet){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const t=setTimeout(()=>{delete window[cb];document.body.removeChild(s);reject(new Error("Timeout"));},15000);
    window[cb]=(d)=>{clearTimeout(t);delete window[cb];document.body.removeChild(s);d&&d.error?reject(new Error(d.error)):resolve(Array.isArray(d)?d:[]);};
    s.src=`${SCRIPT_URL}?sheet=${encodeURIComponent(sheet)}&callback=${cb}`;
    s.onerror=()=>{clearTimeout(t);reject(new Error("Error de red"));};
    document.body.appendChild(s);
  });
}
function sheetsWrite(sheet,rows){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const t=setTimeout(()=>{delete window[cb];document.body.removeChild(s);reject(new Error("Timeout"));},20000);
    window[cb]=(d)=>{clearTimeout(t);delete window[cb];document.body.removeChild(s);d&&d.error?reject(new Error(d.error)):resolve(d);};
    const payload=encodeURIComponent(JSON.stringify({sheet,rows}));
    s.src=`${SCRIPT_URL}?action=write&callback=${cb}&payload=${payload}`;
    s.onerror=()=>{clearTimeout(t);reject(new Error("Error de red"));};
    document.body.appendChild(s);
  });
}

// ── PIN ───────────────────────────────────────────────────────────────────────
function PinModal({pendingRole,onSuccess,onCancel}){
  const [pin,setPin]=useState("");
  const [err,setErr]=useState(false);
  useEffect(()=>{
    const fn=e=>{if(e.key>="0"&&e.key<="9")hk(e.key);else if(e.key==="Backspace")hk("⌫");else if(e.key==="Escape")onCancel();};
    window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
  });
  const hk=k=>{
    if(k==="")return;if(k==="⌫"){setPin(p=>p.slice(0,-1));setErr(false);return;}
    if(pin.length>=4)return;
    const np=pin+String(k);setPin(np);setErr(false);
    if(np.length===4){if(np===PINS[pendingRole])onSuccess();else{setErr(true);setTimeout(()=>{setPin("");setErr(false);},700);}}
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
      <div style={{background:"#fff",borderRadius:14,padding:"1.5rem",width:300,border:"1px solid #ececec",textAlign:"center"}}>
        <p style={{margin:"0 0 4px",fontWeight:500,fontSize:15}}>Ingresá tu PIN</p>
        <p style={{margin:"0 0 1rem",fontSize:12,color:"#666"}}>Rol: {pendingRole==="admin"?"Administrador":"Secretaría"}</p>
        <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:12}}>
          {[0,1,2,3].map(i=><div key={i} style={{width:32,height:40,borderRadius:8,border:`1.5px solid ${err?C.danger:pin.length>i?C.primary:"#ddd"}`,background:"#f8f8f8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,color:err?C.danger:C.primary}}>{pin.length>i?"●":""}</div>)}
        </div>
        {err&&<p style={{margin:"0 0 8px",fontSize:12,color:C.danger}}>PIN incorrecto.</p>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
          {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i)=><button key={i} onClick={()=>hk(k)} disabled={k===""} style={{padding:"12px 0",borderRadius:8,border:"1px solid #ececec",background:k===""?"transparent":"#f8f8f8",cursor:k===""?"default":"pointer",fontSize:16,fontWeight:500,opacity:k===""?0:1}}>{k}</button>)}
        </div>
        <Btn onClick={onCancel} style={{width:"100%",justifyContent:"center"}}>Cancelar</Btn>
      </div>
    </div>
  );
}

  return(
    <div style={{minHeight:"100vh",background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center"}}>

        <p style={{margin:"0 0 1.5rem",fontSize:13,color:"#666"}}>Seleccioná tu rol para ingresar</p>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {[{id:"secretaria",label:"Secretaría",desc:"Turnos, pacientes y cobros"},{id:"admin",label:"Administrador",desc:"Acceso total + caja y configuración"}].map(r=>(
            <button key={r.id} onClick={()=>setPending(r.id)} style={{padding:"12px 16px",borderRadius:10,border:"1px solid #e0e0e0",background:"#f8f8f8",cursor:"pointer",textAlign:"left"}}>
              <p style={{margin:0,fontWeight:500,fontSize:14}}>{r.label}</p>
              <p style={{margin:0,fontSize:12,color:"#666"}}>{r.desc}</p>
            </button>
          ))}
        </div>
      </div>
      {pending&&<PinModal pendingRole={pending} onSuccess={()=>{onLogin(pending);setPending(null);}} onCancel={()=>setPending(null)}/>}
    </div>

}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [role,setRole]=useState(null);
  const [tab,setTab]=useState("agenda");
  const [patients,setPatients]=useState([]);
  const [turnos,setTurnos]=useState([]);
  const [txs,setTxs]=useState([]);
  const [plans,setPlans]=useState([]);
  const [loading,setLoading]=useState(false);
  const [loadMsg,setLoadMsg]=useState("");
  const [saving,setSaving]=useState(false);
  const [saveErr,setSaveErr]=useState("");
  const [selPat,setSelPat]=useState(null);
  const [search,setSearch]=useState("");
  const [agDate,setAgDate]=useState(todayStr());
  const [modal,setModal]=useState(null);
  const [nTurno,setNTurno]=useState({pacienteId:"",fecha:todayStr(),hora:"09:00"});
  const [editTurno,setEditTurno]=useState(null);
  const [nPac,setNPac]=useState({nombre:"",apellido:"",dni:"",fechaNac:"",tel:"",dir:"",email:""});
  const [nTx,setNTx]=useState({pacienteId:"",tipo:"Pago Total",metodo:"Efectivo",monto:"",planId:"",turnoId:""});
  const [repPer,setRepPer]=useState("diario");
  const [editPlans,setEditPlans]=useState([]);
  const [planMsg,setPlanMsg]=useState("");

  const isAdmin=role==="admin";
  const getPac=id=>patients.find(p=>p.id===id);
  const nextId=arr=>arr.length>0?Math.max(...arr.map(x=>Number(x.id)))+1:1;

  const loadAll=useCallback(async()=>{
    setLoading(true);setSaveErr("");
    try{
      setLoadMsg("Cargando planes…");
      const pl=await sheetsGet("planes");
      const plP=pl.map(p=>({...p,id:Number(p.id),sessions:Number(p.sessions),price:Number(p.price)}));
      setPlans(plP);setEditPlans(plP);
      setLoadMsg("Cargando pacientes…");
      const pa=await sheetsGet("pacientes");
      setPatients(pa.map(p=>({...p,id:Number(p.id),sesiones:Number(p.sesiones||0)})));
      setLoadMsg("Cargando turnos…");
      const tu=await sheetsGet("turnos");
      setTurnos(tu.map(t=>({...t,id:Number(t.id),pacienteId:Number(t.pacienteId)})));
      setLoadMsg("Cargando transacciones…");
      const tx=await sheetsGet("transacciones");
      setTxs(tx.map(t=>({...t,id:Number(t.id),pacienteId:Number(t.pacienteId),monto:Number(t.monto),planId:t.planId?Number(t.planId):null,turnoId:t.turnoId?Number(t.turnoId):null})));
    }catch(e){setSaveErr(e.message||"Error al conectar.");}
    finally{setLoading(false);setLoadMsg("");}
  },[]);

  useEffect(()=>{if(role)loadAll();},[role]);

  const save=async(sheet,data)=>{setSaving(true);setSaveErr("");try{await sheetsWrite(sheet,data);}catch(e){setSaveErr("Error: "+e.message);}finally{setSaving(false);}};

  const pendingBalance=pid=>{
    const paid=txs.filter(t=>t.pacienteId===pid&&t.estado==="Activo").reduce((a,t)=>a+t.monto,0);
    const owed=txs.filter(t=>t.pacienteId===pid&&t.estado==="Activo"&&t.planId).reduce((a,t)=>{const pl=plans.find(p=>p.id===t.planId);return a+(pl?pl.price:0);},0);
    return Math.max(0,owed-paid);
  };

  const turnosDia=useMemo(()=>turnos.filter(t=>t.fecha===agDate).sort((a,b)=>a.hora.localeCompare(b.hora)),[turnos,agDate]);
  const turnosSemana=useMemo(()=>{
    const d=new Date(agDate),dow=d.getDay(),mon=new Date(d);
    mon.setDate(d.getDate()-(dow===0?6:dow-1));
    return Array.from({length:7},(_,i)=>{const dd=new Date(mon);dd.setDate(mon.getDate()+i);const date=dd.toISOString().slice(0,10);return{date,ts:turnos.filter(t=>t.fecha===date).sort((a,b)=>a.hora.localeCompare(b.hora))};});
  },[turnos,agDate]);

  const markAsistencia=async(tid,estado)=>{
    let nP=patients;
    const nT=turnos.map(t=>{if(t.id!==tid)return t;if(estado==="Asistió")nP=patients.map(p=>p.id===t.pacienteId&&p.sesiones>0?{...p,sesiones:p.sesiones-1}:p);return{...t,estado};});
    setTurnos(nT);setPatients(nP);await save("turnos",nT);if(estado==="Asistió")await save("pacientes",nP);
  };
  const addTurno=async()=>{
    if(!nTurno.pacienteId||!nTurno.fecha||!nTurno.hora)return;
    const nT=[...turnos,{id:nextId(turnos),pacienteId:parseInt(nTurno.pacienteId),fecha:nTurno.fecha,hora:nTurno.hora,estado:"Pendiente"}];
    setTurnos(nT);setModal(null);await save("turnos",nT);
  };
  const saveEditTurno=async()=>{
    if(!editTurno)return;
    const nT=turnos.map(t=>t.id===editTurno.id?{...t,fecha:editTurno.fecha,hora:editTurno.hora}:t);
    setTurnos(nT);setModal(null);setEditTurno(null);await save("turnos",nT);
  };
  const addPaciente=async()=>{
    if(!nPac.nombre||!nPac.apellido||!nPac.dni)return;
    const nP=[...patients,{id:nextId(patients),...nPac,seguimiento:"",sesiones:0}];
    setPatients(nP);setModal(null);setNPac({nombre:"",apellido:"",dni:"",fechaNac:"",tel:"",dir:"",email:""});
    await save("pacientes",nP);
  };
  const venderPlan=async(pid,planId)=>{
    const pl=plans.find(p=>p.id===planId);if(!pl)return;
    const nP=patients.map(p=>p.id===pid?{...p,sesiones:p.sesiones+pl.sessions}:p);
    const nTx=[...txs,{id:nextId(txs),pacienteId:pid,tipo:"Plan vendido",metodo:"—",monto:pl.price,fecha:nowStr(),estado:"Activo",planId,turnoId:null}];
    setPatients(nP);setTxs(nTx);await save("pacientes",nP);await save("transacciones",nTx);
  };
  const addTx=async()=>{
    if(!nTx.monto||!nTx.pacienteId)return;
    const nList=[...txs,{id:nextId(txs),pacienteId:parseInt(nTx.pacienteId),tipo:nTx.tipo,metodo:nTx.metodo,monto:parseFloat(nTx.monto),fecha:nowStr(),estado:"Activo",planId:nTx.planId?parseInt(nTx.planId):null,turnoId:nTx.turnoId?parseInt(nTx.turnoId):null}];
    setTxs(nList);setNTx({pacienteId:"",tipo:"Pago Total",metodo:"Efectivo",monto:"",planId:"",turnoId:""});
    await save("transacciones",nList);
  };
  const anularTx=async id=>{const n=txs.map(t=>t.id===id?{...t,estado:"Anulado"}:t);setTxs(n);await save("transacciones",n);};
  const saveSeg=async(pid,text)=>{const n=patients.map(p=>p.id===pid?{...p,seguimiento:text}:p);setPatients(n);await save("pacientes",n);};
  const savePlanes=async()=>{setPlans(editPlans);setPlanMsg("Guardando…");await save("planes",editPlans);setPlanMsg("¡Guardado!");setTimeout(()=>setPlanMsg(""),3000);};
  const addPlan=()=>setEditPlans(p=>[...p,{id:nextId(p),name:"Nuevo Plan",sessions:1,price:0}]);

                              <p style={{margin:"0 0 4px",fontSize:11,color:"#666"}}>{pl.sessions} sesiones</p>

                      <p style={{margin:"4px 0 0",fontSize:11,color:"#999"}}>Se guarda al salir del campo.</p>

                  </div>

              </div>
            </div>

                    <option>Efectivo</option>
                    <option>Transferencia</option>
                  </Sel>
                  <Sel label="Asociar a turno de hoy (opcional)" value={nTx.turnoId} onChange={e=>setNTx(p=>({...p,turnoId:e.target.value}))}>

                      <div><label style={{fontSize:11,color:"#666",display:"block",marginBottom:3}}>Nombre</label><input value={pl.name} onChange={e=>updatePlan(pl.id,"name",e.target.value)} style={{fontWeight:500}}/></div>
                      <div><label style={{fontSize:11,color:"#666",display:"block",marginBottom:3}}>Sesiones</label><input type="number" min="1" value={pl.sessions} onChange={e=>updatePlan(pl.id,"sessions",e.target.value)}/></div>
                      <div><label style={{fontSize:11,color:"#666",display:"block",marginBottom:3}}>Precio ($)</label><input type="number" min="0" value={pl.price} onChange={e=>updatePlan(pl.id,"price",e.target.value)}/></div>
                      <Btn small variant="danger" onClick={()=>removePlan(pl.id)} style={{alignSelf:"flex-end",marginBottom:1}}><Ic.Trash/></Btn>
                    </div>
                  ))}
                </div>
                {editPlans.length>0&&(
                  <div style={{marginTop:14,padding:"10px 12px",borderRadius:10,background:C.primaryLight,border:`1px solid ${C.primary}`}}>
                    <p style={{margin:"0 0 8px",fontSize:12,color:C.primary,fontWeight:500}}>Vista previa</p>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {editPlans.map(pl=><div key={pl.id} style={{background:"#fff",borderRadius:8,padding:"8px 12px",fontSize:12,border:"1px solid #ececec"}}><b>{pl.name}</b> · {pl.sessions} ses. · <span style={{color:C.primary,fontWeight:500}}>{fmt(pl.price)}</span></div>)}
                    </div>
                  </div>
                )}
              </Card>
            </div>
          )}
        </div>
      </div>

      {/* Modal nuevo turno */}
      {modal==="turno"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
          <div style={{background:"#fff",borderRadius:14,padding:"1.5rem",width:360,border:"1px solid #ececec"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><p style={{margin:0,fontWeight:500,fontSize:16}}>Agendar turno</p><Btn variant="ghost" small onClick={()=>setModal(null)}><Ic.X/></Btn></div>
            <Sel label="Paciente" value={nTurno.pacienteId} onChange={e=>setNTurno(p=>({...p,pacienteId:e.target.value}))}><option value="">Seleccionar…</option>{patients.map(p=><option key={p.id} value={p.id}>{p.nombre} {p.apellido}</option>)}</Sel>
            <Inp label="Fecha" type="date" value={nTurno.fecha} onChange={e=>setNTurno(p=>({...p,fecha:e.target.value}))}/>
            <Sel label="Hora" value={nTurno.hora} onChange={e=>setNTurno(p=>({...p,hora:e.target.value}))}>{HORAS.map(h=><option key={h} value={h}>{h}</option>)}</Sel>
            <div style={{display:"flex",gap:8,marginTop:8}}><Btn onClick={()=>setModal(null)} style={{flex:1,justifyContent:"center"}}>Cancelar</Btn><Btn variant="primary" onClick={addTurno} style={{flex:1,justifyContent:"center"}}>Confirmar</Btn></div>
          </div>
        </div>
      )}

      {/* Modal editar turno */}
      {modal==="editTurno"&&editTurno&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
          <div style={{background:"#fff",borderRadius:14,padding:"1.5rem",width:360,border:"1px solid #ececec"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><p style={{margin:0,fontWeight:500,fontSize:16}}>Editar turno</p><Btn variant="ghost" small onClick={()=>{setModal(null);setEditTurno(null);}}><Ic.X/></Btn></div>
            <div style={{marginBottom:12,padding:"8px 12px",borderRadius:8,background:C.primaryLight,fontSize:13,fontWeight:500}}>{getPac(editTurno.pacienteId)?.nombre} {getPac(editTurno.pacienteId)?.apellido}</div>
            <Inp label="Nueva fecha" type="date" value={editTurno.fecha} onChange={e=>setEditTurno(t=>({...t,fecha:e.target.value}))}/>
            <Sel label="Nueva hora" value={editTurno.hora} onChange={e=>setEditTurno(t=>({...t,hora:e.target.value}))}>{HORAS.map(h=><option key={h} value={h}>{h}</option>)}</Sel>
            <div style={{display:"flex",gap:8,marginTop:8}}><Btn onClick={()=>{setModal(null);setEditTurno(null);}} style={{flex:1,justifyContent:"center"}}>Cancelar</Btn><Btn variant="primary" onClick={saveEditTurno} style={{flex:1,justifyContent:"center"}}>Guardar</Btn></div>
          </div>
        </div>
      )}

      {/* Modal nuevo paciente */}
      {modal==="paciente"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
          <div style={{background:"#fff",borderRadius:14,padding:"1.5rem",width:400,border:"1px solid #ececec",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><p style={{margin:0,fontWeight:500,fontSize:16}}>Nuevo paciente</p><Btn variant="ghost" small onClick={()=>setModal(null)}><Ic.X/></Btn></div>
            {[["nombre","Nombre","text"],["apellido","Apellido","text"],["dni","DNI","text"],["fechaNac","Fecha de nacimiento","date"],["tel","Teléfono","tel"],["email","Email","email"],["dir","Dirección","text"]].map(([k,l,t])=>(
              <Inp key={k} label={l} type={t} value={nPac[k]} onChange={e=>setNPac(p=>({...p,[k]:e.target.value}))}/>
            ))}
            <div style={{display:"flex",gap:8,marginTop:8}}><Btn onClick={()=>setModal(null)} style={{flex:1,justifyContent:"center"}}>Cancelar</Btn><Btn variant="primary" onClick={addPaciente} style={{flex:1,justifyContent:"center"}}>Registrar</Btn></div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
